[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessmm"
version = "0.1.0"
description = "Guarded decision reuse and recursive self-improvement for agent harness token efficiency"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "Yuhua Jiang"}]
dependencies = []
keywords = ["agents", "harness", "decision-reuse", "token-efficiency", "recursive-self-improvement"]

[project.urls]
Repository = "https://github.com/YuhuaJiang2002/HarnessMM"
Issues = "https://github.com/YuhuaJiang2002/HarnessMM/issues"

[project.optional-dependencies]
dev = ["pytest==8.3.5", "jsonschema==4.26.0", "build>=1.2,<2"]
analysis = ["numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["phiagent*", "integrations*", "scripts*"]
exclude = ["tests*", "examples*", "docs*"]
namespaces = true

[tool.setuptools.package-data]
"integrations.deepseek_harness" = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
