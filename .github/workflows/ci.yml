name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest
      - run: python scripts/verify_release.py
      - run: node --test tests/*.test.mjs
      - run: node examples/guarded_reuse.mjs
      - run: python examples/partition.py
      - run: python -m build
